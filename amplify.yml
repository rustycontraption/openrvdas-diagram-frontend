version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # next.config.ts uses output: "export", which writes the static site to out/
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
