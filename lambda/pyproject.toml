[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrvdas-diagram-lambda"
version = "0.1.0"
description = "AWS Lambda wrapper that serves openrvdas-diagram to the openrvdas-diagram-site frontend"
requires-python = ">=3.12"
dependencies = [
    # Pinned to a commit so deployments are reproducible; update when the tool changes
    "openrvdas-diagram @ git+https://github.com/rustycontraption/openrvdas-diagram@528e4389023cb6162025568dd52ff362925ed848",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
