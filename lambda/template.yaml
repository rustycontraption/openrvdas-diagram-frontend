AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: openrvdas-diagram API - turns OpenRVDAS YAMLs into GraphML and Graphviz DOT for openrvdas-diagram-site

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Description: Origins allowed to call the API, e.g. https://main.abc123.amplifyapp.com

Resources:
  DiagramApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods:
          - POST
        AllowHeaders:
          - content-type
      # Public and unauthenticated, so keep request rates modest
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  DiagramFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Pure Python, so `sam build` packages a zip without Docker; dependencies come from src/requirements.txt
      PackageType: Zip
      Runtime: python3.12
      Architectures:
        - x86_64
      CodeUri: src/
      Handler: openrvdas_diagram_lambda.handler.handle
      MemorySize: 512
      # HTTP APIs give up after 30 seconds
      Timeout: 29
      Events:
        GenerateDiagram:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiagramApi
            Path: /diagram
            Method: POST

Outputs:
  DiagramApiUrl:
    Description: Set NEXT_PUBLIC_DIAGRAM_API_URL in Amplify to this value
    Value: !Sub "https://${DiagramApi}.execute-api.${AWS::Region}.amazonaws.com"
